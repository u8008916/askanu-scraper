[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askanu-scraper"
version = "0.1.0"
description = "AskANU approved-source scraper — collection, normalisation, freshness, and safe ingestion."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "tzdata>=2024.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
askanu-scraper-job = "askanu_scraper.job:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
